[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raen-crewai-tools"
version = "0.1.0"
description = "CrewAI @tool wrappers for RAEN MCP Gateway (dispute_letter and contract_analyze)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "RAEN Contributor" }
]
dependencies = [
    "crewai>=0.28.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
